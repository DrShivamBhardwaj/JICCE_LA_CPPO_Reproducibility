<div id="routing-feedback-architecture">
  <h3>Routing feedback architecture</h3>
  <label class="form-label" for="routing-mode">Implementation</label>
  <select id="routing-mode" class="form-select"><option value="prototype">Authenticated transport prototype</option><option value="frozen">Published frozen study</option></select>
  <label class="form-label" for="routing-stage">Component</label>
  <select id="routing-stage" class="form-select">
    <option value="0">Received beacon cache</option>
    <option value="1">Observation and candidates</option>
    <option value="2">Frozen routing policy</option>
    <option value="3">Packet radio channel</option>
    <option value="4">Observer evidence ledger</option>
    <option value="5">Source service state</option>
  </select>
  <div id="routing-diagram"></div>
  <div id="routing-detail" class="text-small" aria-live="polite"></div>
</div>
<style>
#routing-feedback-architecture .architecture-svg {display:block;width:100%;color:var(--foreground)}
#routing-feedback-architecture .architecture-svg text {fill:var(--foreground);font-family:inherit}
#routing-feedback-architecture .architecture-svg .node {fill:var(--muted);stroke:var(--border);stroke-width:1}
#routing-feedback-architecture .architecture-svg .active {fill:var(--viz-series-1);fill-opacity:.16;stroke:var(--viz-series-1)}
#routing-feedback-architecture .architecture-svg .edge {fill:none;stroke:var(--muted-foreground);stroke-width:1.5}
#routing-feedback-architecture #routing-detail {padding-top:8px}
</style>
<script>
(() => {
 const root=document.getElementById('routing-feedback-architecture');
 const mode=root.querySelector('#routing-mode'),select=root.querySelector('#routing-stage'),holder=root.querySelector('#routing-diagram'),detail=root.querySelector('#routing-detail');
 const labels=[['Beacon cache','Metadata sidecar'],['Observation','93 features'],['Frozen policy','Masked relay choice'],['Radio channel','Data and feedback'],['Observer ledger','ACK gated evidence'],['Source service','Receipt or expiry']];
 const details=[
 'Beacon reception gates access to simulator-held energy and queue values; those values are not serialized.',
 'Candidates use local cache and link estimates, plus simulator-provided geometry and shared visited history.',
 'Fixed attention or capacity-matched MLP weights choose a relay. Holdout outcomes do not retrain the policy.',
 'ns-3 models packet reception, contention and MAC acknowledgments; all radio states enter the assumed energy model.',
 'The observer deduplicates overhears and receipts, requires its own successful first-hop ACK, and censors missing evidence.',
 'Only packet sources update service debt. Transit-relay service debt and distributed route-state exchange are not validated.'
 ];
 const authenticatedLabels=[['Wire telemetry','Decoded beacon values'],['Local state','Packet visited bitset'],['Greedy router','Progress selection'],['Radio channel','HMAC hop frames'],['Receipt ledger','Sink signature check'],['Transit service','Local service debt']];
 const authenticatedDetails=[
 'Neighbor coordinates, energy and queue state are decoded from authenticated frame bytes after radio reception.',
 'Every node stores its own state. A 13-byte visited bitset travels with each data frame; reverse receipt state is local.',
 'This separate prototype uses greedy progress routing. The frozen attention policy has not been benchmarked with the new transport.',
 'Pairwise HMAC-SHA256 authenticates unicast frames. Provisioned boot sessions and sequence windows reject stale or replayed messages.',
 'Ed25519 verifies sink receipts. Forwarding credit additionally requires the local first-hop MAC ACK; overhearing is not credited as authenticated proof.',
 'Transit nodes settle their own service debt on verified receipt or expiry. Keys are provisioned out of band; physical hardware validation remains pending.'
 ];
 const ns='http://www.w3.org/2000/svg';let selected=0;
 function el(name,attrs,text){const e=document.createElementNS(ns,name);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
 function draw(){
  const width=Math.max(280,Math.floor(holder.getBoundingClientRect().width));const small=width<560;const cols=small?2:3;const rows=small?3:2;const cell=(width-16)/cols;const rowH=110,height=rows*rowH+30;
  const svg=el('svg',{class:'architecture-svg',viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':`Feedback architecture with ${labels[selected][0]} selected`});
  svg.append(el('title',{},'Controlled simulation architecture'));
  const defs=el('defs'),marker=el('marker',{id:'routing-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--muted-foreground)'}));defs.append(marker);svg.append(defs);
  const coords=small?[[0,0],[1,0],[1,1],[1,2],[0,2],[0,1]]:[[0,0],[1,0],[2,0],[2,1],[1,1],[0,1]];
  const points=coords.map(([c,r])=>({x:8+c*cell+cell/2,y:20+r*rowH+35}));
  for(const [a,b] of [[0,1],[1,2],[2,3],[3,4],[4,1],[5,1]]){
   const p=points[a],q=points[b],dx=q.x-p.x,dy=q.y-p.y;const horizontal=Math.abs(dx)>Math.abs(dy);const inset=horizontal?cell*.41:30;const distance=Math.hypot(dx,dy);const x1=p.x+dx/distance*inset,y1=p.y+dy/distance*inset,x2=q.x-dx/distance*inset,y2=q.y-dy/distance*inset;
   svg.append(el('path',{d:`M ${x1} ${y1} L ${x2} ${y2}`,class:'edge','marker-end':'url(#routing-arrow)'}));
  }
  const proto=mode.value!=='frozen';
  if(select.options)Array.from(select.options).forEach((option,i)=>{option.textContent=(proto?authenticatedLabels:labels)[i][0];});
  const displayed=proto?(small?[['Telemetry','Wire values'],['Local state','Visited bitset'],['Router','Sinkward'],['Radio','HMAC frames'],['Ledger','Signed receipt'],['Transit state','Service debt']]:authenticatedLabels):(small?[['Cache','Sidecar'],['Observation','93 features'],['Policy','Next relay'],['Radio','Data; receipts'],['Ledger','ACK; receipt'],['Source state','Service debt']]:labels);
  displayed.forEach((parts,i)=>{const p=points[i],w=cell-18;svg.append(el('rect',{x:p.x-w/2,y:p.y-30,width:w,height:60,rx:4,class:`node${i===selected?' active':''}`}));parts.forEach((text,j)=>svg.append(el('text',{x:p.x,y:p.y+(j?15:-5),'text-anchor':'middle'},text)));});
  holder.replaceChildren(svg);detail.textContent=(proto?authenticatedDetails:details)[selected];
 }
 mode.addEventListener('change',draw);
 select.addEventListener('change',()=>{selected=Number(select.value);draw();});new ResizeObserver(draw).observe(holder);draw();
})();
</script>
