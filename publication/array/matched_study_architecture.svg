<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-label="Matched feedback study: intervention factors and common forwarding path">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475d69" stroke-width="1.5"/></marker></defs>
<style>.t{font:700 25px Arial,sans-serif;fill:#1d2933}.h{font:700 16px Arial,sans-serif;fill:#24343e}.s{font:14px Arial,sans-serif;fill:#3c4b55}.tiny{font:12.5px Arial,sans-serif;fill:#3c4b55}.box{fill:#fff;stroke:#7b8a92;stroke-width:1.6}.shade{fill:#f1f4f5;stroke:#7b8a92;stroke-width:1.6}.arrow{stroke:#475d69;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style>
<rect width="1260" height="650" fill="#fff"/><text x="42" y="48" class="t">Matched feedback intervention and outcome path</text><text x="42" y="78" class="s">Four factorial arms share ACK eligibility, record expiry, positive credit and the frozen Q22 actor</text>
<rect x="42" y="118" width="252" height="160" rx="8" class="shade"/><text x="60" y="145" class="h">Missing-evidence update</text><text x="60" y="181" class="h">OFF · censored</text><text x="60" y="203" class="tiny">No failure increment at expiry</text><text x="60" y="237" class="h">ON · negative</text><text x="60" y="259" class="tiny">One weighted failure increment</text>
<rect x="326" y="118" width="238" height="160" rx="8" class="shade"/><text x="344" y="145" class="h">Proof generation</text><text x="344" y="181" class="h">OFF · no proofs</text><text x="344" y="224" class="h">ON · proof frames</text><text x="344" y="250" class="tiny">Additional airtime and delay</text>
<rect x="598" y="118" width="288" height="160" rx="8" class="box"/><text x="616" y="145" class="h">Common evidence handling</text><text x="616" y="179" class="s">Own-hop MAC ACK gate</text><text x="616" y="204" class="s">150 ms ACK-relative expiry</text><text x="616" y="229" class="s">Strongest matched evidence</text><text x="616" y="254" class="s">Late-positive upgrades</text>
<rect x="920" y="118" width="296" height="160" rx="8" class="box"/><text x="938" y="145" class="h">Frozen forwarding path</text><text x="938" y="179" class="s">Neighbor observations</text><text x="938" y="204" class="s">Q22 actor → selected relay</text><text x="938" y="229" class="s">Cooja MAC and forwarding</text><text x="938" y="254" class="s">Sink delivery and TX states</text>
<path d="M294 199 H322" class="arrow"/><path d="M564 199 H594" class="arrow"/><path d="M886 199 H916" class="arrow"/>
<rect x="42" y="318" width="1174" height="126" rx="9" class="box"/><text x="61" y="350" class="h">Primary factorial cells · negative update × proof traffic</text>
<g class="s"><text x="61" y="383">Censored / no proof</text><text x="299" y="383">Censored / proof</text><text x="528" y="383">Negative / no proof</text><text x="780" y="383">Negative / proof</text></g>
<text x="61" y="420" class="tiny">Active-proof reference has different evidence semantics and is analyzed separately, outside the 2 × 2 factorial.</text>
<rect x="42" y="478" width="1174" height="119" rx="9" class="shade"/><text x="61" y="507" class="h">Evaluation design and inference</text>
<text x="61" y="536" class="s">12 geometry blocks × 2 radio seeds × 2 relay permutations × 3 attacker states × 2 timings × 5 arms = 1,440 runs</text>
<text x="61" y="563" class="s">Experimental unit: geometry block · primary endpoint: post-onset sink delivery · Holm family: 6 contrasts</text>
<text x="42" y="631" class="tiny">Simulated RF and scheduling · proof frames do not provide matched-arm positive credit · no physical energy inference</text></svg>