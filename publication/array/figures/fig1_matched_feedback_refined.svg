<svg xmlns="http://www.w3.org/2000/svg" width="2164" height="600" viewBox="0 0 2164 600" role="img" aria-labelledby="title desc">
<title id="title">Matched feedback interventions and forwarding path</title>
<desc id="desc">Four-stage monochrome diagram of controlled negative updates, proof traffic, unchanged ACK-gated evidence and frozen Q22 routing, above the four matched factorial arms.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1f1f1"/><stop offset="1" stop-color="#fff"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker>
<style><![CDATA[
  .t{font-family:Arial,Helvetica,sans-serif;fill:#161616}
  .h{font-size:32px;font-weight:700}
  .lbl{font-size:28px}
  .footer{font-size:28px}
  .pill{font-weight:700;font-size:24px}
  .n{font-size:37px;font-weight:700;fill:white}
  .box{fill:white;stroke:#272727;stroke-width:3;rx:18}
  .rule{fill:none;stroke:#383838;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .connector{stroke:#353535;stroke-width:6;fill:none;marker-end:url(#arr)}
]]></style>
</defs>
<rect width="2164" height="600" fill="white"/>
<!-- Four consistent vertical cards -->
<g>
  <rect class="box" x="55" y="79" width="463" height="378"/>
  <path d="M73 81H500Q518 81 518 99V180H55V99Q55 81 73 81Z" fill="url(#bg)"/>
  <rect class="box" x="570" y="79" width="463" height="378"/>
  <path d="M588 81H1015Q1033 81 1033 99V180H570V99Q570 81 588 81Z" fill="url(#bg)"/>
  <rect class="box" x="1085" y="79" width="463" height="378"/>
  <path d="M1103 81H1530Q1548 81 1548 99V180H1085V99Q1085 81 1103 81Z" fill="url(#bg)"/>
  <rect class="box" x="1600" y="79" width="509" height="378"/>
  <path d="M1618 81H2091Q2109 81 2109 99V180H1600V99Q1600 81 1618 81Z" fill="url(#bg)"/>
</g>
<!-- Stage badges and headers -->
<g class="t">
  <circle cx="286.5" cy="79" r="40" fill="#454545" stroke="white" stroke-width="7"/><text class="n" x="286.5" y="92" text-anchor="middle">1</text>
  <circle cx="801.5" cy="79" r="40" fill="#454545" stroke="white" stroke-width="7"/><text class="n" x="801.5" y="92" text-anchor="middle">2</text>
  <circle cx="1316.5" cy="79" r="40" fill="#454545" stroke="white" stroke-width="7"/><text class="n" x="1316.5" y="92" text-anchor="middle">3</text>
  <circle cx="1854.5" cy="79" r="40" fill="#454545" stroke="white" stroke-width="7"/><text class="n" x="1854.5" y="92" text-anchor="middle">4</text>
  <text class="h" x="286.5" y="156" text-anchor="middle">Negative update</text>
  <text class="h" x="801.5" y="156" text-anchor="middle">Proof traffic</text>
  <text class="h" x="1316.5" y="156" text-anchor="middle">Shared evidence rule</text>
  <text class="h" x="1854.5" y="156" text-anchor="middle">Frozen forwarding</text>
</g>
<!-- Negative-update silence icon -->
<g class="rule">
  <path d="M263 214C235 237 235 274 263 298"/>
  <path d="M307 214C335 237 335 274 307 298"/>
  <path d="M274 230C263 243 263 269 274 282"/>
  <path d="M296 230C307 243 307 269 296 282"/>
  <path d="M248 207L322 300"/>
</g>
<!-- Proof document + verification seal -->
<g class="rule">
  <rect x="748" y="204" width="88" height="94" rx="8"/>
  <path d="M767 224H817 M767 246H817 M767 268H790"/>
  <circle cx="841" cy="283" r="23" fill="white"/>
  <path d="M824 300L818 326L839 313L858 328L857 302"/>
</g>
<!-- ACK expiry clock -->
<g class="rule">
  <circle cx="1252" cy="256" r="51"/>
  <path d="M1252 222V255L1275 273"/>
</g>
<rect x="1311" y="237" width="144" height="60" rx="16" fill="#ececec"/>
<text class="t" x="1383" y="276" text-anchor="middle" font-size="29" font-weight="700">150 ms</text>
<!-- Radio source / sink application delivery icon; not a truck -->
<g class="rule">
  <path d="M1742 301L1768 238L1794 301M1750 282H1786M1768 237V219"/>
  <circle cx="1768" cy="216" r="8" fill="#333"/>
  <path d="M1741 203Q1714 216 1741 238 M1795 203Q1822 216 1795 238 M1725 188Q1682 217 1725 256 M1811 188Q1854 217 1811 256"/>
  <rect x="1992" y="237" width="78" height="68" rx="8"/>
  <path d="M2007 260H2056 M2007 278H2056" stroke-width="5"/>
</g>
<path d="M1846 267H1967" stroke="#333" stroke-width="6" stroke-dasharray="7,11" marker-end="url(#arr)"/>
<!-- Short body copy -->
<g class="t">
  <rect x="92" y="329" width="81" height="42" fill="#e7e7e7" rx="14"/>
  <rect x="92" y="381" width="81" height="42" fill="#e7e7e7" rx="14"/>
  <text class="pill" x="132" y="358" text-anchor="middle">OFF</text>
  <text class="pill" x="132" y="410" text-anchor="middle">ON</text>
  <text class="lbl" x="194" y="358">sensor silence</text>
  <text class="lbl" x="194" y="410">failure increment</text>
  <rect x="606" y="329" width="81" height="42" fill="#e7e7e7" rx="14"/>
  <rect x="606" y="381" width="81" height="42" fill="#e7e7e7" rx="14"/>
  <text class="pill" x="646" y="358" text-anchor="middle">OFF</text>
  <text class="pill" x="646" y="410" text-anchor="middle">ON</text>
  <text class="lbl" x="706" y="358">no proofs</text>
  <text class="lbl" x="706" y="410">authenticated proofs</text>
  <text class="lbl" x="1130" y="355">• ACK gate</text>
  <text class="lbl" x="1130" y="391">• 150 ms expiry</text>
  <text x="1130" y="424" font-size="24">• same positive / late credit</text>
  <text class="lbl" x="1645" y="355">• Q22 relay selection</text>
  <text class="lbl" x="1645" y="403">• post-onset delivery</text>
</g>
<!-- Process connectors -->
<path class="connector" d="M521 267H563"/>
<path class="connector" d="M1036 267H1078"/>
<path class="connector" d="M1551 267H1593"/>
<!-- Factorial design key; no run-count or explanatory footnotes -->
<rect x="55" y="492" width="2054" height="75" rx="16" fill="#f3f3f3" stroke="#c4c4c4" stroke-width="2"/>
<g class="t footer">
<text x="115" y="538" font-weight="700">2 × 2 factorial arms:</text>
<path d="M595 512V547" stroke="#c6c6c6" stroke-width="2"/>
<text x="660" y="538">censored</text>
<text x="865" y="538">•</text>
<text x="903" y="538">censored + proof</text>
<text x="1270" y="538">•</text>
<text x="1310" y="538">negative</text>
<text x="1524" y="538">•</text>
<text x="1562" y="538">negative + proof</text>
</g>
</svg>