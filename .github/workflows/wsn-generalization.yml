name: Generalization 24-geometry evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install analysis dependencies
        run: |
          python -m pip install numpy cryptography matplotlib pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p outputs/generalization_v1
          python -m pip freeze > outputs/generalization_v1/python_environment.txt
      - name: Validate preregistered protocol and controls
        run: |
          python experiments/generalization_v1/run.py --verify-only
          PYTHONPATH=src python -m pytest -q tests/test_remediation_v1.py
      - name: Build isolated Cooja environment
        run: bash experiments/generalization_v1/bootstrap.sh
      - name: Execute preregistered 1920 cases
        run: python experiments/generalization_v1/run.py --execute --workers 2
      - name: Geometry-clustered statistical inference
        run: python experiments/generalization_v1/analyze.py
      - name: Upload raw run records and analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsn-generalization-v1-${{ github.sha }}
          path: outputs/generalization_v1/
          if-no-files-found: error
          retention-days: 90
