name: WSN remediation regression suite
on:
  push:
    paths:
      - '.github/workflows/remediation-regression.yml'
      - 'tests/test_remediation_endpoints.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install numpy cryptography pytest python-docx lxml pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run complete suite
        run: |
          set -o pipefail
          mkdir -p outputs/remediation_regression
          PYTHONPATH=src python -m pytest -q --junitxml=outputs/remediation_regression/junit.xml | tee outputs/remediation_regression/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-regression-${{ github.sha }}
          path: outputs/remediation_regression/
